name: public-test-lab-shadow

on:
  workflow_dispatch:
  push:
    branches:
      - 'verify/public-lab-*'

permissions:
  contents: read

concurrency:
  group: public-test-lab-observation
  cancel-in-progress: false

jobs:
  observe-public-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: seo_lab_observer
          POSTGRES_PASSWORD: disposable-public-lab-ci-only
          POSTGRES_DB: seo_public_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seo_lab_observer -d seo_public_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      LAB_DATABASE_URL: postgresql+psycopg://seo_lab_observer:disposable-public-lab-ci-only@127.0.0.1:5432/seo_public_lab
      AGENT_MODE: deterministic
      PRODUCTION_ENABLED: "false"
      SHADOW_MODE: "true"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install locked observer dependencies
        run: python -m pip install --requirement requirements.lock.txt
      - name: Read the owner-pinned release reference
        id: target
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path('test_lab/public_target.json').read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', config['release_commit'])
          assert re.fullmatch(r'[0-9a-f]{64}', config['expected_manifest_sha256'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_ref=' + config['release_commit'] + '\n')
          PY
      - name: Check out the reviewed public release separately from the served site
        uses: actions/checkout@v4
        with:
          repository: DARKLORDVINAY/seo-test-lab
          ref: ${{ steps.target.outputs.release_ref }}
          path: artifacts/test-lab-public
          persist-credentials: false
      - name: Verify independent owner attestation before network observation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          config = json.loads(Path('test_lab/public_target.json').read_text())
          payload = Path('artifacts/test-lab-public/inventory.json').read_bytes()
          assert hashlib.sha256(payload).hexdigest() == config['expected_manifest_sha256']
          assert json.loads(payload)['base_url'] == config['base_url']
          PY
      - name: Run real public crawl and Level 1 shadow benchmark
        run: python scripts/test_lab.py --mode public --base-url https://seo-test-lab.pages.dev --build-dir artifacts/test-lab-public --report artifacts/test-lab-public-report.json --idempotency-key public-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
      - name: Verify rendered public pages, test interaction and real 404
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/check_test_lab.cjs
        env:
          LAB_PUBLIC_URL: https://seo-test-lab.pages.dev
      - name: Export disposable canonical state for audit only
        if: always()
        run: |
          mkdir -p artifacts
          docker exec "${{ job.services.postgres.id }}" pg_dump -U seo_lab_observer --no-owner --no-acl seo_public_lab > artifacts/public-lab-ci-state.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-test-lab-evidence
          path: |
            artifacts/test-lab-*.json
            artifacts/test-lab-*.png
            artifacts/public-lab-ci-state.sql
          retention-days: 14
          if-no-files-found: error
